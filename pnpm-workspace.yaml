# One workspace: the npm packages and (later) the examples, which take the packages by workspace:*.
packages:
  - packages/*
  - examples/contract
  - examples/plain/api
  - examples/sdk/api
  - examples/ui

# Install scripts of dependencies do not run unless allowed here. esbuild's only checks its binary, which comes with
# its optionalDependencies; core-js's (via @redocly/cli of examples/contract) only prints a banner; msw's (examples/ui)
# copies its service worker into a project that asks for it, and the UI tests use msw/node, not the worker.
allowBuilds:
  core-js: false
  esbuild: false
  msw: false

# Floors from an earlier security review of the React package (the former yarn `resolutions`): esbuild and vite below these
# versions have advisories. A range is a floor, not a pin.
overrides:
  esbuild: ^0.28.2
  vite: ^7.3.7
