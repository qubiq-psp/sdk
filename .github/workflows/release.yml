# Stages a package on npmjs.com when a tag is pushed on a commit of main; a maintainer approves it with 2FA.
#   node-v<version>  → packages/node  (@qubiq-psp/sdk)
#   react-v<version> → packages/react (@qubiq-psp/react)
#
# build   — no secrets: install from the lockfile, all checks of the package, `npm pack`; the tarball goes on as an
#           artifact. For react the smoke then installs React from the registry and checks that very tarball, which must
#           keep its SHA-256: nothing installed after packing can change what is published.
# publish — the GitHub environment `npm` (tags node-v* and react-v* only), npm trusted publishing (OIDC) without a
#           stored token, bound on npmjs.com to this repository, this workflow and this environment; it installs only
#           the pinned npm CLI and runs no package scripts: `npm stage publish <tarball>`.
# Provenance is added for a public repository only (npm refuses it for private ones).
name: release

on:
  push:
    tags: ['node-v*', 'react-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: The package of the tag; the tag is on main and equals its version
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            node-v*) dir=packages/node ;;
            react-v*) dir=packages/react ;;
            *) echo "unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(node -p "require('./$dir/package.json').version")
          test "${GITHUB_REF_NAME%%-v*}-v$version" = "$GITHUB_REF_NAME"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lockfile:check
      # node: every check including the smoke of its own pack; react: every check, the smoke runs on the packed tarball
      - run: pnpm run ${{ steps.pkg.outputs.dir == 'packages/react' && 'ci:release' || 'ci' }}
        working-directory: ${{ steps.pkg.outputs.dir }}
      - name: Pack the tarball to publish
        id: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          mkdir -p dist-pack  # npm pack does not create the destination folder
          npm pack --pack-destination dist-pack
          file=$(ls "$PWD"/dist-pack/*.tgz)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
      # A failed smoke fails this job, and publish does not run
      - run: pnpm run smoke
        if: steps.pkg.outputs.dir == 'packages/react'
        working-directory: packages/react
        env:
          SMOKE_TARBALL: ${{ steps.pack.outputs.file }}
      - name: The published tarball is the checked one
        run: echo "${{ steps.pack.outputs.sha256 }}  ${{ steps.pack.outputs.file }}" | sha256sum --check

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Staged publishing (npm 11.15+; Node 22 ships npm 10): the version waits in the staged queue of npmjs.com until a
      # maintainer approves it with 2FA — the Staged Packages page or `npm stage approve <id>`.
      - name: npm with staged publishing
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Stage
        run: npm stage publish ./*.tgz --access public --ignore-scripts ${{ github.event.repository.private == false && '--provenance' || '' }}
