              $ref: '#/components/headers/X-Example-Call-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Client-Request-Id:
              $ref: '#/components/headers/X-Client-Request-Id'
            X-Api-Key-Deprecated:
              $ref: '#/components/headers/X-Api-Key-Deprecated'
          content:
            application/json:
              schema:
                $ref: 'merchant-api.v1.json#/components/schemas/AccountResponse'
        '4XX':
          $ref: '#/components/responses/PassthroughError'
        '5XX':
          $ref: '#/components/responses/PassthroughError'
