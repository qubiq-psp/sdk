openapi: 3.1.0
info:
  title: PSP examples contract
  version: 0.1.0
  summary: The HTTP contract between the example UI and the two example backends (plain and sdk).
  description: |
    One shared UI (`examples/ui`) talks to either backend (`examples/plain/api` or `examples/sdk/api`) through this
    contract only. A deployment serves one merchant: the API URL, key and secret come from the backend's environment.

    - **Passthrough routes** (tag per area, `x-merchant-api` and `x-sdk-method` set) map one to one onto the 27
      operations of the Merchant API (`/api/v1/<path>` → `/api/<path>`). Parameters, bodies and response schemas are
      `$ref`s into `merchant-api.v1.json` — the OpenAPI 3.1 rendition of the vendored Merchant API copy
      `packages/node/api/openapi.v1.json`. The backend forwards what it receives and returns the platform's status,
      body and the headers listed on each response unchanged — errors included.
    - **Example routes** (`x-example-extra: true`) exist only in the examples: config, the payment-widget link, the
      request log, the received-webhooks log, the receiver behaviour and the SSE stream.
    - **Receiver** `POST /webhooks/psp` is called by the platform, not by the UI.

    The rules both backends must follow are in `examples/contract/README.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin as the UI; nginx routes `/api/*` and `/webhooks/*` to the backend.
security: []
tags:
  - name: Example
    description: Which backend this is and what it is connected to.
  - name: Account
    description: Merchant API — the merchant, status, capabilities, the key of the request.
  - name: Invoices
    description: Merchant API — invoices. The widget link is in the tag Payment widget.
  - name: Payment widget
    description: A signed link to the payment page, built by the backend offline with the API secret.
  - name: Balances and operations
    description: Merchant API — balances, operations, summary, statement.
  - name: Deposits
    description: Merchant API — deposits.
  - name: Payouts
    description: Merchant API — quotes and payout requests.
  - name: Networks and tariff
    description: Merchant API — networks, assets and the tariff.
  - name: Webhook settings
    description: Merchant API — webhook URL, test, delivery log, redelivery.
  - name: Webhook receiver
    description: The backend's own receiver of platform webhooks, its log and its behaviour.
  - name: Request log
    description: Every request the backend sent to the platform, and the SSE stream of new entries.
paths:
