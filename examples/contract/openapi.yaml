          $ref: '#/components/responses/ExampleError'
  /api/request-log/{entryId}:
    get:
      operationId: getRequestLogEntry
      x-example-extra: true
      tags: [Request log]
      summary: One request with headers and bodies
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogEntry'
        '404':
          $ref: '#/components/responses/ExampleError'
  /api/stream:
    get:
      operationId: streamEvents
      x-example-extra: true
      tags: [Request log]
      summary: Server-Sent Events — new request-log entries and received webhooks
      description: |
        `text/event-stream`. On connect: `retry: 3000`, then the event `ready`. Afterwards one event per new
        request-log entry (`request`) and per received webhook (`webhook`); a comment line `: ping` every 20 s.
        `id:` of an event is the id of its entry. There is no replay: after a reconnect the UI refetches the lists.
        The `data:` of each event is one line of JSON, by the schemas in `x-sse-events`.
      x-sse-events:
        ready:
          type: object
          required: [backend, serverTime]
          properties:
            backend: { type: string, enum: [plain, sdk] }
            serverTime: { type: string, format: date-time }
        request:
          $ref: '#/components/schemas/RequestLogItem'
        webhook:
          $ref: '#/components/schemas/ReceivedWebhookItem'
      responses:
        '200':
          description: The event stream; it stays open
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              description: Tells nginx not to buffer the stream.
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 3000

                event: ready
                data: {"backend":"plain","serverTime":"2026-11-17T12:00:00.000Z"}

                event: request
                id: 0b1e…
                data: {"id":"0b1e…","callId":"7c2d…","operationId":"createInvoice",…}

                : ping
        '4XX':
          $ref: '#/components/responses/ExampleError'
  /api/received-webhooks:
    get:
      operationId: listReceivedWebhooks
      x-example-extra: true
      tags: [Webhook receiver]
      summary: Webhooks that reached `POST /webhooks/psp`, newest first
      parameters:
        - name: invoiceId
          in: query
          schema: { type: string }
        - name: webhookId
          in: query
          description: '`X-Webhook-Id` — all attempts and redeliveries of one notification. Equal to the delivery id of `/api/webhook/deliveries`.'
          schema: { type: string }
        - name: event
          in: query
          description: '`X-Webhook-Event`, e.g. `invoice.paid`, `webhook.test`.'
          schema: { type: string }
        - name: result
          in: query
          description: '`ok` — verification passed; `failed` — any other verification result.'
          schema: { type: string, enum: [ok, failed] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedWebhookPage'
        '400':
          $ref: '#/components/responses/ExampleError'
    delete:
      operationId: clearReceivedWebhooks
      x-example-extra: true
      tags: [Webhook receiver]
      summary: Clear the received-webhooks log
      description: The duplicate check of the receiver starts afresh as well.
      responses:
        '204':
          description: Cleared
        '4XX':
          $ref: '#/components/responses/ExampleError'
  /api/received-webhooks/{receivedId}:
    get:
      operationId: getReceivedWebhook
      x-example-extra: true
      tags: [Webhook receiver]
      summary: One received webhook with headers, raw body, verification and our answer
      parameters:
        - name: receivedId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedWebhook'
        '404':
          $ref: '#/components/responses/ExampleError'
  /api/receiver:
    get:
      operationId: getReceiverSettings
      x-example-extra: true
      tags: [Webhook receiver]
      summary: How the receiver answers webhooks
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverSettings'
        '4XX':
          $ref: '#/components/responses/ExampleError'
    put:
      operationId: setReceiverSettings
      x-example-extra: true
      tags: [Webhook receiver]
      summary: Change how the receiver answers — to test retries, `failed` deliveries and redelivery
      description: All fields are required; the answer is the stored settings. Kept in memory, reset on restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiverSettings'
      responses:
        '200':
          description: The stored settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverSettings'
        '400':
          $ref: '#/components/responses/ExampleError'
  /webhooks/psp:
    post:
      operationId: receivePspWebhook
      x-example-extra: true
      x-caller: platform
      tags: [Webhook receiver]
      summary: Receiver of platform webhooks (called by the platform, not by the UI)
      description: |
        Public: nginx must not put basic auth on this path. The backend reads the raw body bytes before any parsing,
        at most 64 KB (the platform's largest webhook; a larger body is `413 example_payload_too_large` and is not
        logged), and verifies them by webhook-service docs 13.6 with the API secret (and `PSP_API_PREVIOUS_SECRET` if
        set), with the semantics of the SDK's `verifyWebhook()` without `expectedMerchantId`. Every other request is
        stored in the received-webhooks log (and sent as the SSE event `webhook`) before the answer — a request whose
        signature did not verify with its first 512 bytes of body only, in a separate ring of the last 100 (see
        `ReceivedWebhook.body`). The answer follows `ReceiverSettings`: in `auto` — `200` on a valid webhook (also a
        duplicate), `401`/`400` by the verification result; `failNext` and `fixed` override the status.
      parameters:
        - { name: X-Webhook-Id, in: header, schema: { type: string } }
        - { name: X-Webhook-Event, in: header, schema: { type: string } }
        - { name: X-Webhook-Timestamp, in: header, schema: { type: string } }
        - { name: X-Webhook-Signature, in: header, schema: { type: string } }
        - { name: X-Webhook-Attempt, in: header, schema: { type: string } }
      requestBody:
        required: true
        description: The webhook body, version 1 (webhook-service docs 13.3). Stored as received, byte for byte.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted (also a duplicate by `X-Webhook-Id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverAck'
        '400':
          description: Valid signature, bad body (`bad_body`, `id_mismatch`, `type_mismatch`, `unsupported_version`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverRefusal'
        '401':
          description: Verification failed (`missing_header`, `bad_timestamp`, `timestamp_out_of_window`, `bad_signature_header`, `signature_mismatch`, `chain_mismatch`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverRefusal'
        '413':
          description: The body is larger than 64 KB (`example_payload_too_large`); not logged, whatever `ReceiverSettings` say
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleError'
        default:
          description: The status set by `ReceiverSettings` (`fixed` or `failNext`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverForced'
components:
  headers:
    X-Example-Call-Id:
      description: |
        Set by the backend on every response of a passthrough route, success or error (also on backend-own errors):
        the id of this contract call. The request-log entries of the call carry it as `callId` — one entry per attempt.
      required: true
      schema: { type: string, format: uuid }
    X-Request-Id:
      description: Platform `X-Request-Id`, passed through. Absent when the platform did not answer.
      schema: { type: string }
    X-Client-Request-Id:
      description: Platform echo of `X-Client-Request-Id`, passed through.
      schema: { type: string }
    X-Api-Key-Deprecated:
      description: Passed through. The request was signed with the previous key; the value is the time until which it works, ISO 8601.
      schema: { type: string }
    Retry-After:
      description: Passed through on `429` and `503 maintenance`.
      schema: { type: string }
  parameters:
    X-Example-Source:
      name: X-Example-Source
      in: header
      required: false
      description: |
        Not forwarded to the platform. `poll` marks a call made by auto-refresh: its request-log entries get
        `source: "poll"` (default `ui`), so the UI can hide them. SSE still emits them.
      schema:
        type: string
        enum: [ui, poll]
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    PassthroughError:
      description: |
        A platform error — status, body and the headers below exactly as the platform sent them — or, when the
        platform gave no usable answer or the backend refused the input before sending, a backend-own error with an
        `example_*` code (see `ExampleErrorCode`).
      headers:
        X-Example-Call-Id:
          $ref: '#/components/headers/X-Example-Call-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-Client-Request-Id:
          $ref: '#/components/headers/X-Client-Request-Id'
        X-Api-Key-Deprecated:
          $ref: '#/components/headers/X-Api-Key-Deprecated'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: 'merchant-api.v1.json#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ExampleError'
    ExampleError:
      description: A backend-own error of an example route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExampleError'
  schemas:
    ExampleErrorCode:
      type: string
      description: |
        Codes of errors produced by a backend itself, never by the platform:
        - `example_invalid_request` (400) — refused before any platform call: a bad JSON body, an `X-Client-Request-Id`
          outside `^[\x21-\x7E]{1,128}$`, a path id that is empty, `.` or `..`, bad widget-link options, bad receiver settings or log
          filters. `details`: `{ field, message }`. `field` names the refused input: for the JSON body, the dotted path
          from its root (`branding.logoUrl`, `expiresInSeconds`, `status`), `body` for the body as a whole; otherwise
          the name of the path parameter, query parameter or header as the contract spells it (`invoiceId`, `status`,
          `X-Client-Request-Id`).
        - `example_not_found` (404) — an unknown route, request-log entry or received webhook.
        - `example_upstream_timeout` (504) — the platform did not answer within `APP_UPSTREAM_TIMEOUT_MS`. `details`:
          `{ timeoutMs }`.
        - `example_upstream_unreachable` (502) — no answer at all: connection refused or closed before the answer, DNS
          or TLS failure. `details`: `{ cause }`.
        - `example_upstream_bad_response` (502) — an answer that is not the platform's: a redirect, a non-JSON error
          body, an empty success body. `details`: `{ status, requestId, bodyPreview }`.
        - `example_payload_too_large` (413) — a body over the limit of its path: 64 KB (65 536 bytes) on
          `POST /webhooks/psp`, 1 MB on `/api/*`. Refused while it arrives, before anything is parsed or logged.
          `details`: `{ limitBytes }`.
        - `example_internal_error` (500) — a bug in the backend.
      enum:
        - example_invalid_request
        - example_not_found
        - example_upstream_timeout
        - example_upstream_unreachable
        - example_upstream_bad_response
        - example_payload_too_large
        - example_internal_error
    ExampleError:
      type: object
      description: The same shape as the platform `ErrorResponse`, with an `example_*` code.
      required: [errorCode, errorMessage, details]
      properties:
        errorCode:
          $ref: '#/components/schemas/ExampleErrorCode'
        errorMessage:
          type: string
          description: English text for the developer. Never contains the secret.
        details:
          type: [object, 'null']
          additionalProperties: true
    Config:
      type: object
      required:
        [backend, version, sdkVersion, net, apiUrl, keyId, previousSecretSet, checkoutUrl, webhookUrl, serverTime]
      properties:
        backend:
          type: string
          enum: [plain, sdk]
        version:
          type: string
          description: Version of the example backend.
        sdkVersion:
          type: [string, 'null']
          description: Version of `@qubiq-psp/sdk` (sdk); `null` (plain).
        net:
          type: string
          enum: [testnet, mainnet]
          description: By the key prefix. Deployed examples are always `testnet`; with `APP_TESTNET_ONLY=true` a backend refuses to start with `psp_pk_live_`.
        apiUrl:
          type: string
          format: uri
          description: Base URL of the Merchant API the backend calls.
        keyId:
          type: string
          description: The API key `psp_pk_…` (public).
          examples: [psp_pk_test_Ab12Cd34Ef56Gh78Ij90Kl12]
        previousSecretSet:
          type: boolean
          description: '`PSP_API_PREVIOUS_SECRET` is set: the receiver also accepts webhooks signed with it.'
        checkoutUrl:
          type: string
          format: uri
          description: Origin of the payment page; the UI allows it in `frame-src` and checks `event.origin` of its messages.
          examples: ['https://pay.psp.qubiq.cc']
        webhookUrl:
          type: [string, 'null']
          format: uri
          description: '`{APP_PUBLIC_URL}/webhooks/psp` — the receiver of this deployment, to set with `PUT /api/webhook`; `null` when `APP_PUBLIC_URL` is not set.'
        serverTime:
          type: string
          format: date-time
    CheckoutBranding:
      type: object
      additionalProperties: false
      description: Appearance of the payment page (gateway docs 20.3). Text is shown as text, the logo only as an image.
      properties:
        companyName: { type: string, minLength: 1, maxLength: 64 }
        logoUrl: { type: string, maxLength: 1024, description: 'An `https:` URL without credentials and `#`.' }
        accentColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        theme: { type: string, enum: [light, dark, auto] }
        title: { type: string, minLength: 1, maxLength: 100, description: 'Order caption, e.g. `Order #10530`.' }
    CheckoutLinkInput:
      type: object
      additionalProperties: false
      description: The options of `psp.checkout.createUrl()`; the plain backend applies the same rules.
      properties:
        branding:
          $ref: '#/components/schemas/CheckoutBranding'
        locale:
          type: string
          enum: [ru, en]
          description: Without it the page follows the buyer's browser.
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          default: 86400
          description: Lifetime of the link. Optional; without it the backend uses 86400 (24 h), as the SDK does.
    CheckoutLink:
      type: object
      required: [url, token, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: '`{checkoutUrl}/#v1.…` — the `src` of the frame.'
        token:
          type: string
          description: The token after `#`.
        expiresAt:
          type: string
          format: date-time
    RequestLogItem:
      type: object
      description: One attempt of one request to the platform. The SSE event `request` carries this object.
      required:
        [
          id,
          callId,
          createdAt,
          source,
          operationId,
          sdkMethod,
          attempt,
          method,
          path,
          status,
          errorCode,
          requestId,
          clientRequestId,
          apiKeyDeprecatedUntil,
          durationMs,
          transportError,
        ]
      properties:
        id: { type: string, format: uuid }
        callId:
          type: string
          format: uuid
          description: '`X-Example-Call-Id` of the contract response this attempt belongs to.'
        createdAt:
          type: string
          format: date-time
          description: When the attempt was sent.
        source:
          type: string
          enum: [ui, poll]
          description: '`poll` when the contract request had `X-Example-Source: poll`, otherwise `ui`.'
        operationId:
          type: string
          description: Merchant API operationId — the coverage test reads it.
        sdkMethod:
          type: [string, 'null']
          description: The SDK method the backend called — `x-sdk-method` of the route, e.g. `invoices.create` (sdk); `null` (plain).
        attempt:
          type: integer
          minimum: 1
          description: 1 for plain (one attempt per call); sdk logs each retry of the SDK as its own entry.
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        path:
          type: string
          description: Path with the query exactly as sent and signed, e.g. `/api/v1/invoices?status=active,partially_paid&limit=20`.
        status:
          type: [integer, 'null']
          description: Platform HTTP status; `null` — no answer (see `transportError`).
        errorCode:
          type: [string, 'null']
          description: '`errorCode` of a non-2xx JSON answer.'
        requestId:
          type: [string, 'null']
          description: '`X-Request-Id` of the answer.'
        clientRequestId:
          type: [string, 'null']
          description: '`X-Client-Request-Id` sent.'
        apiKeyDeprecatedUntil:
          type: [string, 'null']
          description: '`X-Api-Key-Deprecated` of the answer.'
        durationMs:
          type: integer
          minimum: 0
        transportError:
          oneOf:
            - type: 'null'
            - type: object
              required: [code, message]
              properties:
                code: { type: string, enum: [timeout, network] }
                message: { type: string }
    RequestLogEntry:
      description: An entry with headers and bodies. Never contains the API secret.
      allOf:
        - $ref: '#/components/schemas/RequestLogItem'
        - type: object
          required:
            [
              url,
              requestHeaders,
              requestBody,
              requestBodyTruncated,
              responseHeaders,
              responseBody,
              responseBodyTruncated,
              signing,
            ]
          properties:
            url: { type: string, format: uri }
            requestHeaders:
              type: object
              additionalProperties: { type: string }
              description: As sent, signature headers included (`X-Api-Key`, `X-Api-Timestamp`, `X-Api-Nonce`, `X-Api-Signature`).
            requestBody:
              type: [string, 'null']
              description: The body bytes as sent (UTF-8), cut to 64 KB; `null` — no body.
            requestBodyTruncated:
              type: boolean
              description: '`requestBody` is only the first 64 KB of the body sent (the platform refuses larger ones anyway).'
            responseHeaders:
              type: [object, 'null']
              additionalProperties: { type: string }
              description: Header names in lower case.
            responseBody:
              type: [string, 'null']
              description: The body as text, cut to 256 KB.
            responseBodyTruncated: { type: boolean }
            signing:
              description: |
                plain — always: what it signed. sdk — `null` (the SDK signs inside), except at `401 api_auth_failed`
                where the SDK's `PspAuthError.localStringToSign` fills `stringToSign`.
              oneOf:
                - type: 'null'
                - type: object
                  required: [stringToSign, bodySha256]
                  properties:
                    stringToSign:
                      type: string
                      description: The six lines joined with `\n` (gateway docs 13.2).
                    bodySha256: { type: [string, 'null'] }
    RequestLogPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RequestLogItem' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, description: Matching entries still kept. }
    WebhookVerifyResult:
      type: string
      description: |
        `ok` or the first failed step — the reasons of the SDK's `WebhookVerificationError` (webhook-service docs 13.6).
        `merchant_mismatch` is not used: the backends do not pass `expectedMerchantId`.
      enum:
        - ok
        - missing_header
        - bad_timestamp
        - timestamp_out_of_window
        - bad_signature_header
        - signature_mismatch
        - bad_body
        - id_mismatch
        - type_mismatch
        - unsupported_version
        - chain_mismatch
    ReceivedWebhookItem:
      type: object
      description: One request that reached the receiver. The SSE event `webhook` carries this object.
      required:
        [
          id,
          receivedAt,
          webhookId,
          event,
          attempt,
          invoiceId,
          externalId,
          invoiceStatus,
          verifyResult,
          signedWith,
          duplicate,
          responseStatus,
          responseDelayMs,
        ]
      properties:
        id: { type: string, format: uuid, description: Id of the log entry (not the webhook id). }
        receivedAt: { type: string, format: date-time }
        webhookId:
          {
            type: [string, 'null'],
            description: '`X-Webhook-Id` — equal to `id` of the platform delivery (`deliveryId`).',
          }
        event: { type: [string, 'null'], description: '`X-Webhook-Event`.' }
        attempt: { type: [integer, 'null'], description: '`X-Webhook-Attempt`.' }
        invoiceId: { type: [string, 'null'], description: '`data.invoice.id` of the body.' }
        externalId: { type: [string, 'null'], description: '`data.invoice.externalId` of the body.' }
        invoiceStatus: { type: [string, 'null'], description: '`data.invoice.status` of the body.' }
        verifyResult: { $ref: '#/components/schemas/WebhookVerifyResult' }
        signedWith:
          type: [string, 'null']
          enum: [current, previous, null]
          description: Which secret matched; `null` — none.
        duplicate:
          type: boolean
          description: A valid webhook whose `X-Webhook-Id` was already accepted with `2xx`.
        responseStatus: { type: integer, description: What the receiver answered. }
        responseDelayMs: { type: integer, minimum: 0 }
    ReceivedWebhook:
      allOf:
        - $ref: '#/components/schemas/ReceivedWebhookItem'
        - type: object
          required: [remoteIp, headers, body, bodyTruncated, json, verify, responseBody]
          properties:
            remoteIp: { type: [string, 'null'] }
            headers:
              type: object
              additionalProperties: { type: string }
              description: All request headers, names in lower case.
            body:
              type: string
              description: |
                The raw body as received (UTF-8). A request whose signature did not verify (`verify.signatureValid:
                false`) may come from anyone: only its first 512 bytes are kept (`bodyTruncated`), and such requests
                are kept apart — the last 100 — so they cannot push webhooks with a valid signature out of the log.
                `verify.bodyBytes` is always the full size.
            bodyTruncated:
              type: boolean
              description: '`body` is only the first 512 bytes of the request body (a request without a valid signature).'
            json:
              description: The body parsed as JSON; `null` when it is not JSON or the signature did not verify (not parsed).
            verify:
              $ref: '#/components/schemas/WebhookVerification'
            responseBody: { type: [string, 'null'] }
    WebhookVerification:
      type: object
      required: [result, message, timestamp, skewSeconds, signatureValid, expectedSignature, bodyBytes]
      properties:
        result: { $ref: '#/components/schemas/WebhookVerifyResult' }
        message: { type: string, description: 'Why, in English.' }
        timestamp: { type: [integer, 'null'], description: '`X-Webhook-Timestamp`.' }
        skewSeconds: { type: [integer, 'null'], description: Server time minus `timestamp`. }
        signatureValid:
          type: boolean
          description: The signature matches a configured secret, even if another step failed (e.g. the time window).
        expectedSignature:
          type: [string, 'null']
          description: '`v1=…` computed with the current secret over `{timestamp}.{body}` (sdk — `signWebhook()`); `null` without a timestamp.'
        bodyBytes: { type: integer, minimum: 0 }
    ReceivedWebhookPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReceivedWebhookItem' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    ReceiverSettings:
      type: object
      additionalProperties: false
      required: [mode, status, delayMs, failNext]
      properties:
        mode:
          type: string
          enum: [auto, fixed]
          description: '`auto` — `200` on a valid webhook or a duplicate, `401`/`400` on a failed verification; `fixed` — always `status`.'
        status:
          type: integer
          minimum: 200
          maximum: 599
          description: The status of `fixed` mode and of `failNext`.
        delayMs:
          type: integer
          minimum: 0
          maximum: 30000
          description: Delay before the answer. The platform's deadline per attempt is 10 s.
        failNext:
          type: integer
          minimum: 0
          maximum: 100
          description: How many next webhooks get `status` instead of the `auto` answer; counts down.
      examples:
        - { mode: auto, status: 500, delayMs: 0, failNext: 0 }
    ReceiverAck:
      type: object
      required: [received, duplicate]
      properties:
        received: { type: boolean, const: true }
        duplicate: { type: boolean }
    ReceiverRefusal:
      type: object
      required: [errorCode, errorMessage]
      properties:
        errorCode: { $ref: '#/components/schemas/WebhookVerifyResult' }
        errorMessage: { type: string }
    ReceiverForced:
      type: object
      required: [forced]
      properties:
        forced:
          type: string
          enum: [fixed, fail_next]
